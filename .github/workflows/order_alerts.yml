name: BSE Order Book Alerts

on:
  schedule:
    - cron: "*/15 3-13 * * 1-6" # 8:30 AM to 6:30 PM IST (Mon-Sat)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Run Order Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python order_bot.py
      - name: Save Seen State
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add seen_orders.json
          git commit -m "Update seen orders" || exit 0
          git push
